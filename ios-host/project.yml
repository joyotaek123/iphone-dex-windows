name: iPhoneDeXHost
options:
  bundleIdPrefix: com.iphonedex
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO

targets:
  iPhoneDeXHost:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iphonedex.host
        PRODUCT_NAME: iPhoneDeXHost
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
    dependencies:
      - sdk: UIKit.framework
      - sdk: Network.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: AVFoundation.framework
      - sdk: QuartzCore.framework
